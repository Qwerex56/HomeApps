# Local development: the whole story is in docs/development.md.
#   docker compose -f compose.dev.yaml --profile services up -d --build   every service in a container (the usual way)
#   docker compose -f compose.dev.yaml up -d                              infrastructure only, services from Rider
# Everything is served at https://app.localhost through Traefik; the Vue app always runs on the Mac (vite on :5173).
# Each service container is also published on its Rider port (Auth 5100 ... Devices 5800), so stopping one container
# and running that service from Rider changes nothing for the others' routes (dynamic/dev-routes.yaml).
# Values come from .env when present (copy .env.example); the defaults below work without it.
name: homeapps

services:
  traefik:
    image: traefik:v2.11
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      # TLS for every router on websecure, so a plugin's own compose labels (no tls label, like production) work here.
      - "--entrypoints.websecure.http.tls=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
      - ./dynamic:/dynamic:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # Catches every email; the inbox is at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  auth:
    profiles: ["services"]
    build:
      context: .
      dockerfile: src/Auth/Auth.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_auth;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Auth__Email__Smtp__Host: mailpit
      Auth__Bootstrap__Email: ${AUTH_BOOTSTRAP_EMAIL:-}
      Auth__Google__ClientId: ${AUTH_GOOGLE_CLIENT_ID:-}
      Auth__Google__ClientSecret: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      # Traefik is the only proxy in front of Auth; trust its X-Forwarded-For.
      Auth__Proxy__KnownNetworks__0: "0.0.0.0/0"
      # The service clients' secrets from the same variables the devices and jarvis containers read, so both sides
      # always match. Indexes follow Auth's appsettings.Development.json (2 jarvis-service, 3 devices-service).
      Auth__Clients__2__ClientId: jarvis-service
      Auth__Clients__2__Secret: ${JARVIS_CLIENT_SECRET:-development-only-jarvis-secret-0123456789}
      Auth__Clients__3__ClientId: devices-service
      Auth__Clients__3__Secret: ${DEVICES_CLIENT_SECRET:-development-only-devices-secret-0123456789}
    # Published as 5100 too, so Accounts from Rider reads the keys the same way when Auth runs here.
    ports:
      - "5100:8080"
    volumes:
      - auth-keys:/app/.keys
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    labels:
      - "traefik.enable=true"
      # Higher priority than the file route to Rider (dynamic/dev-routes.yaml), so the container wins while it runs.
      - "traefik.http.routers.auth.rule=Host(`app.localhost`) && (PathPrefix(`/auth`) || PathPrefix(`/.well-known`))"
      - "traefik.http.routers.auth.priority=200"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls=true"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"

  accounts:
    profiles: ["services"]
    build:
      context: .
      dockerfile: src/Accounts/Accounts.Api/Dockerfile
    ports:
      - "5200:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_accounts;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      # Keys straight from the auth container (Q10); the tokens still name the public issuer.
      Jwt__Authority: "http://auth:8080"
      Jwt__Issuer: "https://app.localhost"
      Jwt__RequireHttpsMetadata: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.accounts.rule=Host(`app.localhost`) && (PathPrefix(`/users`) || PathPrefix(`/admin/users`))"
      - "traefik.http.routers.accounts.priority=200"
      - "traefik.http.routers.accounts.entrypoints=websecure"
      - "traefik.http.routers.accounts.tls=true"
      - "traefik.http.services.accounts.loadbalancer.server.port=8080"

  households:
    profiles: ["services"]
    build:
      context: .
      dockerfile: src/Households/Households.Api/Dockerfile
    ports:
      - "5300:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_households;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: "http://auth:8080"
      Jwt__Issuer: "https://app.localhost"
      Jwt__RequireHttpsMetadata: "false"
      Households__MaxMembers: ${HOUSEHOLDS_MAX_MEMBERS:-100}
      Households__Internal__ClientSecret: ${JARVIS_CLIENT_SECRET:-development-only-jarvis-secret-0123456789}
      Households__Internal__Devices__ClientSecret: ${DEVICES_CLIENT_SECRET:-development-only-devices-secret-0123456789}
      Households__Internal__HomeMix__ClientSecret: ${HOMEMIX_CLIENT_SECRET:-development-only-homemix-secret-0123456789}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.households.rule=Host(`app.localhost`) && (PathPrefix(`/households`) || PathPrefix(`/invites`) || PathPrefix(`/admin/households`))"
      - "traefik.http.routers.households.priority=200"
      - "traefik.http.routers.households.entrypoints=websecure"
      - "traefik.http.routers.households.tls=true"
      - "traefik.http.services.households.loadbalancer.server.port=8080"

  notifications:
    profiles: ["services"]
    build:
      context: .
      dockerfile: src/Notifications/Notifications.Api/Dockerfile
    ports:
      - "5500:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_notifications;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: "http://auth:8080"
      Jwt__Issuer: "https://app.localhost"
      Jwt__RequireHttpsMetadata: "false"
      # Empty: a temporary pair on every start (docs/notifications.md); scripts/generate-vapid-keys.sh makes lasting ones.
      Notifications__Vapid__PublicKey: ${NOTIFICATIONS_VAPID_PUBLIC_KEY:-}
      Notifications__Vapid__PrivateKey: ${NOTIFICATIONS_VAPID_PRIVATE_KEY:-}
      Notifications__Vapid__Subject: ${NOTIFICATIONS_VAPID_SUBJECT:-https://app.localhost}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notifications.rule=Host(`app.localhost`) && PathPrefix(`/notifications`)"
      - "traefik.http.routers.notifications.priority=200"
      - "traefik.http.routers.notifications.entrypoints=websecure"
      - "traefik.http.routers.notifications.tls=true"
      - "traefik.http.services.notifications.loadbalancer.server.port=8080"

  homemix:
    profiles: ["services"]
    build:
      context: .
      dockerfile: src/HomeMix/HomeMix.Api/Dockerfile
    ports:
      - "5600:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_homemix;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: "http://auth:8080"
      Jwt__Issuer: "https://app.localhost"
      Jwt__RequireHttpsMetadata: "false"
      # Add-ons may not take the ids of the instance's plugins (docs/homemix.md).
      HomeMix__Plugins: ${HOMEAPPS_PLUGINS:-}
      HomeMix__PackagesPath: /data/packages
      HomeMix__HouseholdsUrl: "http://households:8080"
      HomeMix__DevicesUrl: "http://devices:8080"
      # Its service client: Devices (triggers set controls) and Households (who the admins are) list it as Internal:HomeMix.
      HomeMix__ClientSecret: ${HOMEMIX_CLIENT_SECRET:-development-only-homemix-secret-0123456789}
      # The official add-ons the image built (appsettings.Development.json points at the Rider folder instead).
      HomeMix__OfficialPath: /app/official
    volumes:
      - homemix-packages:/data/packages
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
    labels:
      - "traefik.enable=true"
      # Not /mcp: the MCP server is reached only inside the Docker network (through the JARVIS gateway).
      - "traefik.http.routers.homemix.rule=Host(`app.localhost`) && (PathPrefix(`/homemix/api`) || PathPrefix(`/homemix/run`) || PathPrefix(`/homemix/hub`))"
      - "traefik.http.routers.homemix.priority=200"
      - "traefik.http.routers.homemix.entrypoints=websecure"
      - "traefik.http.routers.homemix.tls=true"
      - "traefik.http.services.homemix.loadbalancer.server.port=8080"

  devices:
    profiles: ["services"]
    build:
      context: .
      dockerfile: src/Devices/Devices.Api/Dockerfile
    ports:
      - "5800:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_devices;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: "http://auth:8080"
      Jwt__Issuer: "https://app.localhost"
      Jwt__RequireHttpsMetadata: "false"
      # Bridges sign in through "Połączone aplikacje" with a token for the gateway; Devices accepts it too.
      Devices__Resource: "https://app.localhost/jarvis/mcp"
      # Traefik is the only proxy in front of Devices; trust its X-Forwarded-For (the /devices/pair limit is per IP).
      Devices__Proxy__KnownNetworks__0: "0.0.0.0/0"
      Devices__AuthUrl: "http://auth:8080"
      # appsettings.Development.json points at localhost:5300 (running from Rider); in a container Households is a sibling.
      Devices__HouseholdsUrl: "http://households:8080"
      Devices__ClientSecret: ${DEVICES_CLIENT_SECRET:-development-only-devices-secret-0123456789}
      Devices__Internal__ClientSecret: ${JARVIS_CLIENT_SECRET:-development-only-jarvis-secret-0123456789}
      Devices__Internal__HomeMix__ClientSecret: ${HOMEMIX_CLIENT_SECRET:-development-only-homemix-secret-0123456789}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
    labels:
      - "traefik.enable=true"
      # Not /mcp: the MCP server is reached only inside the Docker network (through the JARVIS gateway).
      - "traefik.http.routers.devices.rule=Host(`app.localhost`) && PathPrefix(`/devices`)"
      - "traefik.http.routers.devices.priority=200"
      - "traefik.http.routers.devices.entrypoints=websecure"
      - "traefik.http.routers.devices.tls=true"
      - "traefik.http.services.devices.loadbalancer.server.port=8080"

  jarvis:
    profiles: ["services"]
    build:
      context: .
      dockerfile: src/Jarvis/Jarvis.Api/Dockerfile
    ports:
      - "5700:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Authority: "http://auth:8080"
      Jwt__Issuer: "https://app.localhost"
      Jwt__RequireHttpsMetadata: "false"
      Jarvis__Resource: "https://app.localhost/jarvis/mcp"
      Jarvis__AuthUrl: "http://auth:8080"
      Jarvis__Plugins: ${HOMEAPPS_PLUGINS:-}
      Jarvis__PluginUrl: "http://{id}:8080"
      # appsettings.Development.json sends these to Rider's ports; in a container the plugins' own containers answer.
      Jarvis__PluginUrls__todo: "http://todo:8080"
      Jarvis__PluginUrls__chat: "http://chat:8080"
      Jarvis__Sources__0__Url: "http://households:8080/mcp"
      Jarvis__Sources__1__Url: "http://accounts:8080/mcp"
      Jarvis__Sources__2__Url: "http://homemix:8080/mcp"
      Jarvis__Sources__3__Url: "http://devices:8080/mcp"
      Jarvis__ClientSecret: ${JARVIS_CLIENT_SECRET:-development-only-jarvis-secret-0123456789}
      # Owner's Claude subscription (`claude setup-token`); without it JARVIS answers that he is switched off.
      Jarvis__ClaudeCode__OAuthToken: ${JARVIS_CLAUDE_CODE_OAUTH_TOKEN:-}
      Jarvis__ClaudeCode__Model: ${JARVIS_CLAUDE_MODEL:-}
      # Claude Code inside the container calls the gateway on the container's own port, not Rider's 5700.
      Jarvis__ClaudeCode__GatewayUrl: "http://localhost:8080/jarvis/mcp"
      # Ears and voice: Speaches from compose.voice.yaml on the same Mac (docs/jarvis.md "Voice").
      Jarvis__Voice__Enabled: "true"
      Jarvis__Voice__SttUrl: ${JARVIS_VOICE_URL:-http://host.docker.internal:8000}
      Jarvis__Voice__TtsUrl: ${JARVIS_VOICE_URL:-http://host.docker.internal:8000}
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_jarvis;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      auth:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Only the gateway and its RFC 9728 metadata; the services' own MCP servers stay inside the Docker network.
      - "traefik.http.routers.jarvis.rule=Host(`app.localhost`) && (PathPrefix(`/jarvis/api`) || PathPrefix(`/jarvis/mcp`) || Path(`/jarvis/voice`) || Path(`/.well-known/oauth-protected-resource/jarvis/mcp`))"
      - "traefik.http.routers.jarvis.priority=300"
      - "traefik.http.routers.jarvis.entrypoints=websecure"
      - "traefik.http.routers.jarvis.tls=true"
      - "traefik.http.services.jarvis.loadbalancer.server.port=8080"

volumes:
  postgres-data:
  auth-keys:
  homemix-packages:
