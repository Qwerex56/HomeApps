# Traefik sends only the app's own paths here; every service path goes straight to its service.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite puts a content hash in these names, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell and the service worker must be checked on every visit, or an update never arrives (PWA).
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    # Written at start from HOMEAPPS_PLUGINS (docker/40-plugins-json.sh).
    location = /plugins.json { add_header Cache-Control "no-cache"; }

    # History mode router: any other path is a page of the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
