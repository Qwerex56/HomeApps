# Routes to what runs on the Mac during development (docs/development.md): Auth from Rider on :5100, Accounts :5200,
# Households :5300, Todo :5400, Chat :5410, Notifications :5500, HomeMix :5600, JARVIS :5700, Devices :5800 and Vue
# (vite) on :5173. Containers (the "services" profile, a plugin's own compose) win with a higher priority.
http:
  routers:
    auth-host:
      rule: "Host(`app.localhost`) && (PathPrefix(`/auth`) || PathPrefix(`/.well-known`))"
      priority: 100
      entryPoints: [websecure]
      service: auth-host
      tls: {}
    accounts-host:
      rule: "Host(`app.localhost`) && (PathPrefix(`/users`) || PathPrefix(`/admin/users`))"
      priority: 100
      entryPoints: [websecure]
      service: accounts-host
      tls: {}
    households-host:
      rule: "Host(`app.localhost`) && (PathPrefix(`/households`) || PathPrefix(`/invites`) || PathPrefix(`/admin/households`))"
      priority: 100
      entryPoints: [websecure]
      service: households-host
      tls: {}
    notifications-host:
      rule: "Host(`app.localhost`) && PathPrefix(`/notifications`)"
      priority: 100
      entryPoints: [websecure]
      service: notifications-host
      tls: {}
    homemix-host:
      rule: "Host(`app.localhost`) && (PathPrefix(`/homemix/api`) || PathPrefix(`/homemix/run`) || PathPrefix(`/homemix/hub`))"
      priority: 100
      entryPoints: [websecure]
      service: homemix-host
      tls: {}
    devices-host:
      rule: "Host(`app.localhost`) && PathPrefix(`/devices`)"
      priority: 100
      entryPoints: [websecure]
      service: devices-host
      tls: {}
    jarvis-host:
      rule: "Host(`app.localhost`) && (PathPrefix(`/jarvis/api`) || PathPrefix(`/jarvis/mcp`) || Path(`/jarvis/voice`) || Path(`/.well-known/oauth-protected-resource/jarvis/mcp`))"
      priority: 150
      entryPoints: [websecure]
      service: jarvis-host
      tls: {}
    # Plugins from an IDE. A plugin's container claims the same prefix with its default priority (the rule's length).
    todo-host:
      rule: "Host(`app.localhost`) && PathPrefix(`/plugins/todo`)"
      priority: 10
      entryPoints: [websecure]
      service: todo-host
      tls: {}
    chat-host:
      rule: "Host(`app.localhost`) && PathPrefix(`/plugins/chat`)"
      priority: 10
      entryPoints: [websecure]
      service: chat-host
      tls: {}
    frontend-host:
      rule: "Host(`app.localhost`)"
      priority: 1
      entryPoints: [websecure]
      service: frontend-host
      tls: {}
  services:
    auth-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5100"
    accounts-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5200"
    households-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5300"
    notifications-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5500"
    homemix-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5600"
    devices-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5800"
    jarvis-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5700"
    todo-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5400"
    chat-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5410"
    frontend-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5173"
