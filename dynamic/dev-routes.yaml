# Routes to what runs on the host during development (Q19): Auth from Rider on :5100, Accounts on :5200,
# Households on :5300, Notifications on :5500, HomeMix on :5600, JARVIS on :5700, Vue (vite) on :5173. The containers from the "services" profile override these routes with a higher priority.
http:
  routers:
    auth-host:
      rule: "Host(`app.localhost`) && (PathPrefix(`/auth`) || PathPrefix(`/.well-known`))"
      priority: 100
      entryPoints: [websecure]
      service: auth-host
      tls: {}
    accounts-host:
      rule: "Host(`app.localhost`) && (PathPrefix(`/users`) || PathPrefix(`/admin/users`))"
      priority: 100
      entryPoints: [websecure]
      service: accounts-host
      tls: {}
    households-host:
      rule: "Host(`app.localhost`) && (PathPrefix(`/households`) || PathPrefix(`/invites`) || PathPrefix(`/admin/households`))"
      priority: 100
      entryPoints: [websecure]
      service: households-host
      tls: {}
    notifications-host:
      rule: "Host(`app.localhost`) && PathPrefix(`/notifications`)"
      priority: 100
      entryPoints: [websecure]
      service: notifications-host
      tls: {}
    homemix-host:
      rule: "Host(`app.localhost`) && (PathPrefix(`/homemix/api`) || PathPrefix(`/homemix/run`))"
      priority: 100
      entryPoints: [websecure]
      service: homemix-host
      tls: {}
    jarvis-host:
      rule: "Host(`app.localhost`) && (PathPrefix(`/jarvis/api`) || PathPrefix(`/jarvis/mcp`) || Path(`/.well-known/oauth-protected-resource/jarvis/mcp`))"
      priority: 150
      entryPoints: [websecure]
      service: jarvis-host
      tls: {}
    frontend-host:
      rule: "Host(`app.localhost`)"
      priority: 1
      entryPoints: [websecure]
      service: frontend-host
      tls: {}
  services:
    auth-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5100"
    accounts-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5200"
    households-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5300"
    notifications-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5500"
    homemix-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5600"
    jarvis-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5700"
    frontend-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5173"
