# Routes to what runs on the host during development (Q19): Auth from Rider on :5100, Accounts on :5200,
# Vue (vite) on :5173. The containers from the "services" profile override these routes with a higher priority.
http:
  routers:
    auth-host:
      rule: "Host(`app.localhost`) && (PathPrefix(`/auth`) || PathPrefix(`/.well-known`))"
      priority: 100
      entryPoints: [websecure]
      service: auth-host
      tls: {}
    accounts-host:
      rule: "Host(`app.localhost`) && (PathPrefix(`/users`) || PathPrefix(`/admin/users`))"
      priority: 100
      entryPoints: [websecure]
      service: accounts-host
      tls: {}
    frontend-host:
      rule: "Host(`app.localhost`)"
      priority: 1
      entryPoints: [websecure]
      service: frontend-host
      tls: {}
  services:
    auth-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5100"
    accounts-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5200"
    frontend-host:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5173"
