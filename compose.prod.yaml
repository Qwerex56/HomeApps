# Production: everything at https://${HOMEAPPS_DOMAIN} (home-apps.dev), certificates from Let's Encrypt (release plan Q2).
#   cp .env.prod.example .env            fill in the values marked "required"
#   scripts/generate-signing-key.sh      once: secrets/auth-signing.pem, the key Auth signs tokens with
#   scripts/generate-vapid-keys.sh       once: the Web Push keys for .env (Notifications)
#   docker compose -f compose.prod.yaml up -d --build
# Ports 80 and 443 must reach this machine (HTTP-01 challenge). Postgres and RabbitMQ are not published; only Traefik is.
# No public address (CGNAT)? Add the overlay compose.tunnel.yaml (Cloudflare Tunnel, no open ports).
# Every service applies its migrations on start (Q3). Deployment guide: docs/deployment.md.
name: homeapps

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-environment: &environment
  ASPNETCORE_ENVIRONMENT: Production
  Database__MigrateOnStartup: "true"
  # Without this every SQL statement lands in the log.
  Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: ${RABBITMQ_USER:-homeapps}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}

# Services that read Auth's keys inside the Docker network; the tokens still name the public issuer (accounts plan Q10).
x-jwt: &jwt
  Jwt__Authority: "http://auth:8080"
  Jwt__Issuer: "https://${HOMEAPPS_DOMAIN:?set HOMEAPPS_DOMAIN in .env}"
  Jwt__RequireHttpsMetadata: "false"

services:
  traefik:
    image: traefik:v2.11
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeapps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-homeapps}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
      # The first start (a new volume) can take longer than the retries above on a small machine.
      start_period: 60s

  auth:
    <<: *service
    image: homeapps/auth:2.3.0
    build:
      context: .
      dockerfile: src/Auth/Auth.Api/Dockerfile
    environment:
      <<: *environment
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_auth;Username=${POSTGRES_USER:-homeapps};Password=${POSTGRES_PASSWORD}"
      Jwt__Authority: "https://${HOMEAPPS_DOMAIN}"
      Auth__Signing__Issuer: "https://${HOMEAPPS_DOMAIN}"
      Auth__Clients__0__RedirectUris__0: "https://${HOMEAPPS_DOMAIN}/"
      Auth__Bootstrap__Email: ${AUTH_BOOTSTRAP_EMAIL:?set AUTH_BOOTSTRAP_EMAIL in .env}
      Auth__Google__ClientId: ${AUTH_GOOGLE_CLIENT_ID:-}
      Auth__Google__ClientSecret: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      Auth__Email__FrontendBaseUrl: "https://${HOMEAPPS_DOMAIN}"
      # JARVIS (docs/jarvis.md): his service client for delegated tokens, and the gateway apps may connect to (OAuth).
      Auth__Clients__1__ClientId: jarvis-service
      Auth__Clients__1__Name: "JARVIS (service)"
      Auth__Clients__1__Type: Service
      Auth__Clients__1__Secret: ${JARVIS_CLIENT_SECRET:?set JARVIS_CLIENT_SECRET in .env}
      Auth__ConnectedApps__Resources__0: "https://${HOMEAPPS_DOMAIN}/jarvis/mcp"
      Auth__Email__From: ${SMTP_FROM:?set SMTP_FROM in .env}
      Auth__Email__Smtp__Host: ${SMTP_HOST:?set SMTP_HOST in .env}
      Auth__Email__Smtp__Port: ${SMTP_PORT:-587}
      Auth__Email__Smtp__Username: ${SMTP_USERNAME:-}
      Auth__Email__Smtp__Password: ${SMTP_PASSWORD:-}
      # Auth is reachable only through Traefik (no published port), so its X-Forwarded-For is the real caller.
      Auth__Proxy__KnownNetworks__0: "0.0.0.0/0"
    # The PEM key as a file: /run/secrets/Auth__Signing__PrivateKeyPem is read as that setting (kit, key per file).
    secrets:
      - source: auth-signing-key
        target: Auth__Signing__PrivateKeyPem
    volumes:
      - auth-keys:/app/.keys
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`${HOMEAPPS_DOMAIN}`) && (PathPrefix(`/auth`) || PathPrefix(`/.well-known`))"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"

  accounts:
    <<: *service
    image: homeapps/accounts:2.3.0
    build:
      context: .
      dockerfile: src/Accounts/Accounts.Api/Dockerfile
    environment:
      <<: [*environment, *jwt]
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_accounts;Username=${POSTGRES_USER:-homeapps};Password=${POSTGRES_PASSWORD}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.accounts.rule=Host(`${HOMEAPPS_DOMAIN}`) && (PathPrefix(`/users`) || PathPrefix(`/admin/users`))"
      - "traefik.http.routers.accounts.entrypoints=websecure"
      - "traefik.http.services.accounts.loadbalancer.server.port=8080"

  households:
    <<: *service
    image: homeapps/households:2.3.0
    build:
      context: .
      dockerfile: src/Households/Households.Api/Dockerfile
    environment:
      <<: [*environment, *jwt]
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_households;Username=${POSTGRES_USER:-homeapps};Password=${POSTGRES_PASSWORD}"
      Households__MaxMembers: ${HOUSEHOLDS_MAX_MEMBERS:-100}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.households.rule=Host(`${HOMEAPPS_DOMAIN}`) && (PathPrefix(`/households`) || PathPrefix(`/invites`) || PathPrefix(`/admin/households`))"
      - "traefik.http.routers.households.entrypoints=websecure"
      - "traefik.http.services.households.loadbalancer.server.port=8080"

  notifications:
    <<: *service
    image: homeapps/notifications:2.3.0
    build:
      context: .
      dockerfile: src/Notifications/Notifications.Api/Dockerfile
    environment:
      <<: [*environment, *jwt]
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_notifications;Username=${POSTGRES_USER:-homeapps};Password=${POSTGRES_PASSWORD}"
      Notifications__Vapid__PublicKey: ${NOTIFICATIONS_VAPID_PUBLIC_KEY:?set NOTIFICATIONS_VAPID_PUBLIC_KEY in .env (scripts/generate-vapid-keys.sh)}
      Notifications__Vapid__PrivateKey: ${NOTIFICATIONS_VAPID_PRIVATE_KEY:?set NOTIFICATIONS_VAPID_PRIVATE_KEY in .env (scripts/generate-vapid-keys.sh)}
      Notifications__Vapid__Subject: ${NOTIFICATIONS_VAPID_SUBJECT:-https://${HOMEAPPS_DOMAIN}}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notifications.rule=Host(`${HOMEAPPS_DOMAIN}`) && PathPrefix(`/notifications`)"
      - "traefik.http.routers.notifications.entrypoints=websecure"
      - "traefik.http.services.notifications.loadbalancer.server.port=8080"

  homemix:
    <<: *service
    image: homeapps/homemix:2.3.0
    build:
      context: .
      dockerfile: src/HomeMix/HomeMix.Api/Dockerfile
    environment:
      <<: [*environment, *jwt]
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_homemix;Username=${POSTGRES_USER:-homeapps};Password=${POSTGRES_PASSWORD}"
      # Add-ons may not take the ids of the instance's plugins (docs/homemix.md).
      HomeMix__Plugins: ${HOMEAPPS_PLUGINS:-}
      HomeMix__UploadsEnabled: ${HOMEMIX_UPLOADS_ENABLED:-true}
      HomeMix__GitHubToken: ${HOMEMIX_GITHUB_TOKEN:-}
      HomeMix__StoreIndexUrl: ${HOMEMIX_STORE_INDEX-https://raw.githubusercontent.com/Qwerex56/HomeApps/master/homemix/store/addons.json}
    volumes:
      - homemix-packages:/data/packages
    labels:
      - "traefik.enable=true"
      # Not /mcp: the MCP server is reached only inside the Docker network (through the JARVIS gateway).
      - "traefik.http.routers.homemix.rule=Host(`${HOMEAPPS_DOMAIN}`) && (PathPrefix(`/homemix/api`) || PathPrefix(`/homemix/run`))"
      - "traefik.http.routers.homemix.entrypoints=websecure"
      - "traefik.http.services.homemix.loadbalancer.server.port=8080"

  jarvis:
    <<: *service
    image: homeapps/jarvis:2.3.0
    build:
      context: .
      dockerfile: src/Jarvis/Jarvis.Api/Dockerfile
    environment:
      <<: [*environment, *jwt]
      ConnectionStrings__Database: "Host=postgres;Database=homeapps_jarvis;Username=${POSTGRES_USER:-homeapps};Password=${POSTGRES_PASSWORD}"
      Jarvis__Resource: "https://${HOMEAPPS_DOMAIN}/jarvis/mcp"
      Jarvis__ClientSecret: ${JARVIS_CLIENT_SECRET:?set JARVIS_CLIENT_SECRET in .env}
      Jarvis__Plugins: ${HOMEAPPS_PLUGINS:-}
      # The owner's Claude subscription (`claude setup-token`); empty: JARVIS answers that he is switched off, while
      # connected apps (Claude Code, claude.ai) still use the gateway.
      Jarvis__ClaudeCode__OAuthToken: ${JARVIS_CLAUDE_CODE_OAUTH_TOKEN:-}
      # Optional (docs/jarvis.md): Jarvis__ClaudeCode__Model, Jarvis__DailyBudgetUsd (default 2 USD a day for the home).
    labels:
      - "traefik.enable=true"
      # The gateway, the API and the gateway's OAuth metadata; /jarvis itself is a page of the web app.
      - "traefik.http.routers.jarvis.rule=Host(`${HOMEAPPS_DOMAIN}`) && (PathPrefix(`/jarvis/api`) || PathPrefix(`/jarvis/mcp`) || Path(`/.well-known/oauth-protected-resource/jarvis/mcp`))"
      - "traefik.http.routers.jarvis.priority=300"
      - "traefik.http.routers.jarvis.entrypoints=websecure"
      - "traefik.http.services.jarvis.loadbalancer.server.port=8080"

  web:
    image: homeapps/web:2.3.0
    restart: unless-stopped
    build:
      context: src/Web
    environment:
      HOMEAPPS_PLUGINS: ${HOMEAPPS_PLUGINS:-}
    labels:
      - "traefik.enable=true"
      # Lowest priority: everything the services above do not claim is a page of the Vue app.
      - "traefik.http.routers.web.rule=Host(`${HOMEAPPS_DOMAIN}`)"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.services.web.loadbalancer.server.port=80"

secrets:
  auth-signing-key:
    file: ./secrets/auth-signing.pem

volumes:
  letsencrypt:
  postgres-data:
  rabbitmq-data:
  auth-keys:
  homemix-packages:
